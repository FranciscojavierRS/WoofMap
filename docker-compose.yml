services:
  db:
    image: postgis/postgis:17-3.5
    container_name: woofmap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # Obligatorio: define POSTGRES_PASSWORD en .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en .env}
    ports:
      # Solo accesible desde tu maquina (IDE, DBeaver, backend en local)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./WoofMapApi
      dockerfile: Dockerfile
    container_name: woofmap-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en .env}
      # Obligatorio: define JWT_SECRET en .env (openssl rand -base64 48)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en .env}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
